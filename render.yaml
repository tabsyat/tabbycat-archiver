services:
  - type: web
    name: tabbycat-static-archiver
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
